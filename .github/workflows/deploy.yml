name: Coordinated Deploy (Backend & Frontend)

on:
  push:
    branches: [ main, master ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and dispatching workflows
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Typecheck backend
        run: cd backend && npm run typecheck

      - name: Test backend
        run: cd backend && npm test

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Missing GitHub Actions secrets for automated Worker deploy (${missing[*]}). Configure them under Settings -> Secrets and variables -> Actions. Skipping wrangler deploy in CI; build-frontend will verify the live Worker contract and smoke checks."
            exit 0
          fi
          cd backend && npx wrangler deploy

  build-frontend:
    name: Build Frontend
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Test frontend
        run: cd frontend && npm test

      # Coordinated release gate: verify backend contract and smoke check v2 endpoint
      - name: Verify production backend API contract & smoke check
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::VITE_API_BASE_URL secret is required"
            exit 1
          fi
          BASE="${VITE_API_BASE_URL%/}"
          echo "Checking backend health at ${BASE}/"
          BODY=$(curl -fsS --max-time 30 "${BASE}/")
          echo "$BODY"
          node -e '
            const required = ["workers-ai-analyze-v1", "provider-status-v1", "firms-global-v2"];
            const body = JSON.parse(process.argv[1]);
            const v = String(body.version || "");
            const caps = Array.isArray(body.capabilities) ? body.capabilities : [];
            const missing = required.filter((c) => !caps.includes(c));
            if (missing.length > 0) {
              console.error("Backend", v || "(no version)", "lacks capabilities required by this frontend:", missing.join(", "));
              process.exit(1);
            }
            console.log("Backend contract gate passed:", v, caps.join(", "));
          ' "$BODY"

          NEEDS_INGEST=0
          for WIN in 24h 7d; do
            echo "Running smoke check: GET ${BASE}/api/v2/disasters?window=${WIN}"
            TMP_BODY=$(mktemp)
            STATUS=$(curl -s -o "$TMP_BODY" -w "%{http_code}" --max-time 30 "${BASE}/api/v2/disasters?window=${WIN}")
            echo "Status (${WIN}): $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::error::Smoke check failed for window=${WIN}: expected 200, got $STATUS"
              rm -f "$TMP_BODY"
              exit 1
            fi
            FIRMS_STATUS=$(node -e '
              const fs = require("node:fs");
              const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (data.version !== 2 || data.window !== process.argv[2] || !Array.isArray(data.fireCells)) {
                console.error("Invalid v2 payload shape for window", process.argv[2]);
                process.exit(1);
              }
              process.stdout.write(String(data.sources?.firms?.status || "unknown"));
            ' "$TMP_BODY" "$WIN")
            rm -f "$TMP_BODY"
            echo "Verified v2 response for window=${WIN} (firms.status=${FIRMS_STATUS})"
            if [ "$FIRMS_STATUS" = "unavailable" ]; then
              NEEDS_INGEST=1
            fi
          done
          echo "Smoke checks passed!"

          if [ "$NEEDS_INGEST" = "1" ]; then
            echo "No FIRMS snapshot present for at least one window; triggering firms-ingest.yml..."
            gh workflow run firms-ingest.yml --repo "${GITHUB_REPOSITORY}" || echo "::warning::Could not trigger firms-ingest.yml automatically"
          fi

      - name: Build frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: cd frontend && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy-frontend:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
