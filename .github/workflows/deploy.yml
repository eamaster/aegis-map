name: Coordinated Deploy & Verification (Backend & Frontend)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and dispatching workflows
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Verify & Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Typecheck backend
        run: cd backend && npm run typecheck

      - name: Test backend
        run: cd backend && npm test

      # D1 schema migrations are applied by an authorized operator (`wrangler d1 migrations apply AEGIS_DB --remote`,
      # see docs/COORDINATED_RELEASE.md). The CI token is deliberately scoped to Worker deploys only: the D1 query API
      # rejects it (Cloudflare error 7403). Schema readiness is still a hard gate: the build-frontend job refuses to
      # publish unless the deployed Worker reports services.d1 === "ready" (all tables + migration 0002 indexes).
      - name: Deploy Worker to Cloudflare
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required Cloudflare secrets for production Worker deploy (${missing[*]}). Refusing to skip backend deploy on main push."
            exit 1
          fi
          cd backend
          npx wrangler deploy --var "GIT_SHA:${GITHUB_SHA}"

  build-frontend:
    name: Lint, Test & Build Frontend
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Test frontend
        run: cd frontend && npm test

      # Coordinated release gate: verify immutable Worker SHA, D1 schema readiness, capabilities, and smoke checks on push
      - name: Verify production backend identity, D1 readiness & smoke checks
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          GITHUB_SHA_EXPECTED: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::VITE_API_BASE_URL secret is required"
            exit 1
          fi
          BASE="${VITE_API_BASE_URL%/}"
          echo "Checking backend identity & capabilities at ${BASE}/ (expected SHA ${GITHUB_SHA_EXPECTED})"

          PASSED=0
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            BODY=$(curl -fsS --max-time 30 "${BASE}/" || true)
            if [ -n "$BODY" ] && node -e '
              const expectedSha = process.env.GITHUB_SHA_EXPECTED;
              const required = [
                "workers-ai-analyze-v1",
                "provider-status-v1",
                "firms-global-v2",
                "official-warnings-v1",
                "sar-stac-v1",
                "disaster-history-v1",
                "warning-subscriptions-v1",
              ];
              const body = JSON.parse(process.argv[1]);
              if (body.commitSha !== expectedSha) {
                console.error("Attempt mismatch: deployed commitSha=", body.commitSha, "expected=", expectedSha);
                process.exit(1);
              }
              if (body.services?.d1 !== "ready") {
                console.error("Attempt failed: services.d1=", body.services?.d1);
                process.exit(1);
              }
              const caps = Array.isArray(body.capabilities) ? body.capabilities : [];
              const missing = required.filter((c) => !caps.includes(c));
              if (missing.length > 0) {
                console.error("Missing required capabilities:", missing.join(", "));
                process.exit(1);
              }
              console.log("Verified Worker identity:", body.version, "sha=" + body.commitSha, "d1=" + body.services.d1, "emailDelivery=" + body.services.emailDelivery);
            ' "$BODY"; then
              PASSED=1
              break
            fi
            echo "Waiting for Worker edge propagation (attempt ${ATTEMPT}/8)..."
            sleep 3
          done
          if [ "$PASSED" != "1" ]; then
            echo "::error::Production Worker identity / D1 readiness / capability gate failed for commit ${GITHUB_SHA_EXPECTED}"
            exit 1
          fi

          NEEDS_INGEST=0
          for WIN in 24h 7d; do
            echo "Running smoke check: GET ${BASE}/api/v2/disasters?window=${WIN}"
            TMP_BODY=$(mktemp)
            STATUS=$(curl -s -o "$TMP_BODY" -w "%{http_code}" --max-time 30 "${BASE}/api/v2/disasters?window=${WIN}")
            echo "Status (${WIN}): $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::error::Smoke check failed for window=${WIN}: expected 200, got $STATUS"
              rm -f "$TMP_BODY"
              exit 1
            fi
            FIRMS_STATUS=$(node -e '
              const fs = require("node:fs");
              const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (data.version !== 2 || data.window !== process.argv[2] || !Array.isArray(data.fireCells)) {
                console.error("Invalid v2 payload shape for window", process.argv[2]);
                process.exit(1);
              }
              process.stdout.write(String(data.sources?.firms?.status || "unknown"));
            ' "$TMP_BODY" "$WIN")
            rm -f "$TMP_BODY"
            echo "Verified v2 response for window=${WIN} (firms.status=${FIRMS_STATUS})"
            if [ "$FIRMS_STATUS" = "unavailable" ]; then
              NEEDS_INGEST=1
            fi
          done

          echo "Running warnings smoke check: GET ${BASE}/api/v1/warnings?lat=59.9139&lng=10.7522&country=NO"
          WARN_BODY=$(curl -fsS --max-time 30 "${BASE}/api/v1/warnings?lat=59.9139&lng=10.7522&country=NO")
          node -e '
            const w = JSON.parse(process.argv[1]);
            if (w.version !== 1 || !Array.isArray(w.sources) || !Array.isArray(w.warnings)) {
              console.error("Invalid warnings response shape");
              process.exit(1);
            }
            console.log("Verified /api/v1/warnings:", w.coverageStatus, "sources=" + w.sources.map((s) => s.sourceId + ":" + s.status).join(","));
          ' "$WARN_BODY"

          echo "Running non-mutating D1-backed smoke checks (/api/v1/history, /api/v1/analytics/sources, /api/v1/subscriptions/status)..."
          HIST_BODY=$(curl -fsS --max-time 30 "${BASE}/api/v1/history?limit=5")
          ANALYTICS_BODY=$(curl -fsS --max-time 30 "${BASE}/api/v1/analytics/sources")
          SUB_STATUS_BODY=$(curl -fsS --max-time 30 "${BASE}/api/v1/subscriptions/status")
          node -e '
            const hist = JSON.parse(process.argv[1]);
            const analytics = JSON.parse(process.argv[2]);
            const subStatus = JSON.parse(process.argv[3]);
            if (!hist.storageAvailable || !Array.isArray(hist.events)) {
              console.error("D1 history check failed:", hist);
              process.exit(1);
            }
            if (!analytics.storageAvailable || !Array.isArray(analytics.providers)) {
              console.error("D1 analytics check failed:", analytics);
              process.exit(1);
            }
            if (typeof subStatus.available !== "boolean" || subStatus.smsAvailable !== false) {
              console.error("Subscription status check failed:", subStatus);
              process.exit(1);
            }
            console.log("Verified D1 endpoints: historyEvents=" + hist.events.length, "analyticsProviders=" + analytics.providers.length, "emailDeliveryMode=" + subStatus.mode);
          ' "$HIST_BODY" "$ANALYTICS_BODY" "$SUB_STATUS_BODY"

          if [ "$NEEDS_INGEST" = "1" ]; then
            echo "No FIRMS snapshot present for at least one window; triggering firms-ingest.yml..."
            gh workflow run firms-ingest.yml --repo "${GITHUB_REPOSITORY}" || echo "::warning::Could not trigger firms-ingest.yml automatically"
          fi

      - name: Build frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: cd frontend && npm run build

      - name: Setup Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy-frontend:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
