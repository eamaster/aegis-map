name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**' # Only trigger when frontend changes

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Coordinated release gate: do not publish a frontend that requires
      # Workers AI analyze responses against an unverified legacy backend.
      - name: Verify production backend AI contract
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "VITE_API_BASE_URL secret is required"
            exit 1
          fi
          BASE="${VITE_API_BASE_URL%/}"
          echo "Checking backend health at ${BASE}/"
          BODY=$(curl -fsS --max-time 30 "${BASE}/")
          echo "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            const v = String(body.version || "");
            const ok = /^(1\.(?:[2-9]|\d{2,})|[2-9]\d*)(\.|$)/.test(v);
            if (!ok) {
              console.error("Backend version too old for this frontend:", v, "(need >= 1.2.0)");
              process.exit(1);
            }
            console.log("Backend version gate passed:", v);
          ' "$BODY"

      - name: Build
        env:
          # These pull from the secrets you set in Step 3
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: cd frontend && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
